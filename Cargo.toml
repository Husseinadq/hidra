[package]
name = "hidra"
version = "0.1.0"
edition = "2021"
description = "Configure Logitech HID++ mice on Linux"
license = "MIT"
rust-version = "1.93"
resolver = "3"

[dependencies]
eframe = ">=0.31, <0.37"
serde = { version = "1", features = ["derive"] }
toml = "1"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
